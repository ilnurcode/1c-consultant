name: build Windows application

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Read and verify version
        id: meta
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw -LiteralPath PACKAGE_MANIFEST.json | ConvertFrom-Json
          $version = $manifest.application_version
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME must match PACKAGE_MANIFEST.json version v$version."
          }

      - name: Install build tools
        run: python -m pip install --disable-pip-version-check pyinstaller==6.15.0

      - name: Validate sources
        run: python scripts/validate_repository.py

      - name: Build EXE and portable ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          python scripts/build_application.py `
            --platform windows `
            --arch x64 `
            --output "release/1c-consultant-$version-windows-x64.zip"
          if ($LASTEXITCODE -ne 0) { throw "Application build failed." }
          Copy-Item -LiteralPath dist/windows-x64/consultant.exe `
            -Destination "release/1c-consultant-$version-windows-x64.exe"
          Get-ChildItem -LiteralPath release -File |
            Sort-Object Name |
            ForEach-Object {
              "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant(), $_.Name
            } | Set-Content -Encoding ascii -LiteralPath release/SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1c-consultant-windows-x64-${{ steps.meta.outputs.version }}
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath release -File | ForEach-Object FullName)
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @assets `
              --target $env:GITHUB_SHA `
              --title "1C-Consultant ${{ steps.meta.outputs.version }}" `
              --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed." }
