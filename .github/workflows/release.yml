name: publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Application version from PACKAGE_MANIFEST.json"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-application:
    name: application ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            arch: x64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: x64
          - runner: macos-15
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build native application package
        shell: bash
        run: |
          python -m pip install pyinstaller==6.15.0
          python -m pip install -e .
          version="$(python -c 'import json; print(json.load(open("PACKAGE_MANIFEST.json", encoding="utf-8"))["application_version"])')"
          python scripts/build_application.py \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --output "application-packages/1c-consultant-${version}-${{ matrix.platform }}-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: application-${{ matrix.platform }}-${{ matrix.arch }}
          path: application-packages/*.zip
          if-no-files-found: error

      - uses: actions/setup-go@v7
        if: matrix.platform == 'macos'
        with:
          go-version: "1.22.x"
          cache: false

      - name: Build unsigned macOS pkg
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          version="$(python -c 'import json; print(json.load(open("PACKAGE_MANIFEST.json", encoding="utf-8"))["application_version"])')"
          bash deployment/scripts/build-macos-pkg.sh \
            "${{ matrix.arch }}" "$version" \
            "macos-packages/1c-consultant-installer-macos-${{ matrix.arch }}.pkg"

      - uses: actions/upload-artifact@v7
        if: matrix.platform == 'macos'
        with:
          name: macos-pkg-${{ matrix.arch }}
          path: macos-packages/*.pkg
          if-no-files-found: error

  release:
    needs: build-application
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          pattern: application-*
          path: application-packages
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: macos-pkg-*
          path: release
          merge-multiple: true

      - name: Verify version and repository
        shell: pwsh
        run: |
          $package = Get-Content -Raw -LiteralPath PACKAGE_MANIFEST.json | ConvertFrom-Json
          $expectedTag = "v$($package.application_version)"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Release tag $env:RELEASE_TAG does not match PACKAGE_MANIFEST.json ($expectedTag)."
          }
          python scripts/validate_repository.py
          if ($LASTEXITCODE -ne 0) { throw "Repository validation failed." }
          "VERSION=$($package.application_version)" >> $env:GITHUB_ENV
          "GRAPH_VERSION=$($package.configuration_pack.graph_version)" >> $env:GITHUB_ENV
          "GRAPH_DATABASE_SHA256=$($package.configuration_pack.graph_database_sha256)" >> $env:GITHUB_ENV

      - name: Build installer binaries and collect application packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          ./deployment/scripts/build-installers.ps1 -OutputDirectory release
          python deployment/scripts/package_installers.py release
          Get-ChildItem -Path application-packages -Filter *.zip -Recurse -File | Copy-Item -Destination release -Force
          $baseUrl = "https://github.com/${{ github.repository }}/releases/download/$env:RELEASE_TAG"
          python deployment/scripts/generate_manifest.py --release-dir release --base-url $baseUrl --version $env:VERSION
          Get-ChildItem -LiteralPath release -File | Where-Object Name -ne "SHA256SUMS" |
            Sort-Object Name | ForEach-Object {
              "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant(), $_.Name
            } | Set-Content -Encoding ascii -LiteralPath release/SHA256SUMS

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath release -File | ForEach-Object FullName)
          gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $env:RELEASE_TAG @assets `
              --repo "${{ github.repository }}" `
              --target $env:GITHUB_SHA `
              --title "1C-Consultant $env:VERSION" `
              --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed." }
